<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수박 게임 - 클리어 기능 포함판</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #ffeaa7, #fab1a0);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; user-select: none;
        }
        /* 메인 레이아웃: 게임판과 진화 도표를 가로로 배치 */
        #main-wrapper {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        #game-container { position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border-radius: 12px; overflow: hidden; }
        
        /* 우측 원형 성장 과정 도표 및 컨트롤 타워 스타일 */
        #side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        #evolution-guide {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #evolution-guide h3 { margin: 0 0 10px 0; color: #2d3436; font-size: 18px; }
        #guide-canvas { background: #fffdf9; border-radius: 50%; border: 2px dashed #ffeaa7; }

        /* 일시정지 버튼 스타일 */
        #pause-btn {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #0984e3;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(9, 132, 227, 0.3);
            transition: all 0.2s ease;
        }
        #pause-btn:hover { background: #74b9ff; transform: translateY(-2px); }
        #pause-btn:active { transform: translateY(0); }

        #score-board {
            position: absolute; top: 20px; left: 20px; background: rgba(255, 255, 255, 0.85);
            padding: 10px 20px; border-radius: 20px; font-size: 20px; font-weight: bold;
            color: #2d3436; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); backdrop-filter: blur(5px);
        }
        #combo-tag {
            position: absolute; top: 70px; left: 20px; background: #ff7675; color: white;
            padding: 5px 15px; border-radius: 15px; font-size: 14px; font-weight: bold; opacity: 0; pointer-events: none;
        }
        
        /* 스크린 오버레이 (게임오버, 일시정지, 게임클리어 공용) */
        .modal-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85);
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease; z-index: 10;
        }
        .modal-screen.show { opacity: 1; pointer-events: auto; }
        .modal-screen h1 { font-size: 44px; margin-bottom: 10px; }
        
        #game-over-screen h1 { color: #ff7675; }
        #pause-screen h1 { color: #f1c40f; }
        #victory-screen h1 { color: #2ecc71; text-shadow: 0 0 20px rgba(46, 204, 113, 0.6); } /* 승리 화면 스타일 */

        .modal-btn { padding: 12px 35px; font-size: 18px; font-weight: bold; border: none; border-radius: 25px; cursor: pointer; margin-top: 15px; }
        .restart-style { background: #55efc4; color: #2d3436; }
        #resume-btn { background: #74b9ff; color: white; }
    </style>
</head>
<body>

<div id="main-wrapper">
    <div id="game-container">
        <div id="score-board">SCORE: <span id="score">0</span></div>
        <div id="combo-tag">🔥 <span id="combo-count">0</span> COMBO!</div>
        
        <div id="game-over-screen" class="modal-screen">
            <h1>GAME OVER</h1>
            <p>최종 점수: <span id="final-score">0</span>점</p>
            <button class="modal-btn restart-style" onclick="resetGame()">다시 도전하기</button>
        </div>

        <div id="pause-screen" class="modal-screen">
            <h1>PAUSED</h1>
            <p>잠시 쉬어가는 중...</p>
            <button id="resume-btn" class="modal-btn" onclick="togglePause(event)">게임 계속하기</button>
        </div>

        <div id="victory-screen" class="modal-screen">
            <h1>🏆 VICTORY! 🏆</h1>
            <p>축하합니다! 전설의 대수박을 완성했습니다!</p>
            <p>최종 클리어 점수: <span id="victory-score">0</span>점</p>
            <button class="modal-btn restart-style" onclick="resetGame()">한 번 더 하기</button>
        </div>
    </div>

    <div id="side-panel">
        <div id="evolution-guide">
            <h3>과일 성장 순서 (시계방향)</h3>
            <canvas id="guide-canvas" width="220" height="220"></canvas>
        </div>
        <button id="pause-btn" onclick="togglePause(event)">⏸️ 게임 일시정지</button>
    </div>
</div>

<script>
    const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;

    const WIDTH = 480;
    const HEIGHT = 750;
    const DEAD_LINE = 160;
    
    let engine, render, runner;
    let score = 0; let combo = 0; let comboTimer = null;
    let currentFruit = null; let nextFruitType = null;
    let isClickCooldown = false; let isGameOver = false; let gameOverTimestamp = null;
    let isPaused = false; 
    let isGameWon = false; // [추가] 게임 승리 상태 스위치 변수

    const FRUIT_TYPES = [
        { level: 0, radius: 18, score: 2,  emoji: '🍒', color: '#ff7675' },
        { level: 1, radius: 24, score: 4,  emoji: '🍓', color: '#e84393' },
        { level: 2, radius: 31, score: 8,  emoji: '🍇', color: '#6c5ce7' },
        { level: 3, radius: 39, score: 16, emoji: '🍊', color: '#e17055' },
        { level: 4, radius: 48, score: 32, emoji: '🍎', color: '#d63031' },
        { level: 5, radius: 58, score: 64, emoji: '🍏', color: '#2ecc71' },
        { level: 6, radius: 69, score: 128, emoji: '🍑', color: '#fdd9d9' },
        { level: 7, radius: 81, score: 256, emoji: '🍍', color: '#f1c40f' },
        { level: 8, radius: 95, score: 512, emoji: '🍈', color: '#badc58' },
        { level: 9, radius: 115, score: 1024, emoji: '🍉', color: '#27ae60' }
    ];

    const container = document.getElementById('game-container');

    function initGame() {
        isGameOver = false; isPaused = false; isGameWon = false; score = 0; combo = 0;
        document.getElementById('score').innerText = score;
        document.getElementById('game-over-screen').classList.remove('show');
        document.getElementById('pause-screen').classList.remove('show');
        document.getElementById('victory-screen').classList.remove('show'); // 승리 화면 초기화
        document.getElementById('pause-btn').innerText = "⏸️ 게임 일시정지";

        engine = Engine.create({ gravity: { y: 1.2 } });

        render = Render.create({
            element: container,
            engine: engine,
            options: { width: WIDTH, height: HEIGHT, wireframes: false, background: '#fef8e7' }
        });
        Render.run(render);

        runner = Runner.create();
        Runner.run(runner, engine);

        const wallOptions = { isStatic: true, render: { fillStyle: '#e5cc9f' } };
        const ground = Bodies.rectangle(WIDTH / 2, HEIGHT - 15, WIDTH, 30, wallOptions);
        const leftWall = Bodies.rectangle(10, HEIGHT / 2, 20, HEIGHT, wallOptions);
        const rightWall = Bodies.rectangle(WIDTH - 10, HEIGHT / 2, 20, HEIGHT, wallOptions);
        
        Composite.add(engine.world, [ground, leftWall, rightWall]);

        Events.on(render, 'afterRender', drawGameUI);
        Events.on(engine, 'collisionStart', handleCollision);
        Events.on(engine, 'afterUpdate', checkGameOverLogic);

        nextFruitType = getRandomFruitType();
        spawnReadyFruit();
        
        drawEvolutionCircle();
    }

    function togglePause(e) {
        if (isGameOver || isGameWon) return; // 승리 상태여도 작동 중지

        if (e && e.stopPropagation) {
            e.stopPropagation(); // 버블링 전파 원천 차단 (낙하 버그 수정)
        }

        isPaused = !isPaused;
        const pauseScreen = document.getElementById('pause-screen');
        const pauseBtn = document.getElementById('pause-btn');

        if (isPaused) {
            Runner.stop(runner);
            pauseScreen.classList.add('show');
            pauseBtn.innerText = "▶️ 게임 재개하기";
            clearTimeout(comboTimer);
        } else {
            Runner.run(runner, engine);
            pauseScreen.classList.remove('show');
            pauseBtn.innerText = "⏸️ 게임 일시정지";

            if (combo > 0) {
                comboTimer = setTimeout(() => { combo = 0; document.getElementById('combo-tag').style.opacity = '0'; }, 2500);
            }
        }
    }

    function drawEvolutionCircle() {
        const canvas = document.getElementById('guide-canvas');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const orbitRadius = 72;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.arc(centerX, centerY, orbitRadius, 0, Math.PI * 2);
        ctx.strokeStyle = '#dfe6e9';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        const total = FRUIT_TYPES.length;
        FRUIT_TYPES.forEach((fruit, idx) => {
            const angle = (-Math.PI / 2) + (idx * (Math.PI * 2 / total));
            const x = centerX + Math.cos(angle) * orbitRadius;
            const y = centerY + Math.sin(angle) * orbitRadius;

            const displayRadius = 8 + (fruit.level * 2.2);
            
            ctx.beginPath();
            ctx.arc(x, y, displayRadius, 0, Math.PI * 2);
            ctx.fillStyle = fruit.color;
            ctx.globalAlpha = 0.45; 
            ctx.fill();
            ctx.globalAlpha = 1.0;

            const fontSize = Math.max(10, Math.floor(displayRadius * 1.1));
            ctx.font = `${fontSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(fruit.emoji, x, y);

            if(idx < total - 1) {
                const nextAngle = (-Math.PI / 2) + ((idx + 0.5) * (Math.PI * 2 / total));
                const ax = centerX + Math.cos(nextAngle) * (orbitRadius);
                const ay = centerY + Math.sin(nextAngle) * (orbitRadius);
                ctx.fillStyle = '#b2bec3';
                ctx.font = '11px sans-serif';
                ctx.fillText('→', ax, ay);
            }
        });
    }

    function drawGameUI() {
        const ctx = render.context;
        const bodies = Composite.allBodies(engine.world);

        bodies.forEach(body => {
            if (body.label === 'fruit') {
                const type = FRUIT_TYPES[body.plugin.level];
                ctx.save();
                ctx.translate(body.position.x, body.position.y);
                ctx.rotate(body.angle);
                
                ctx.font = `${type.radius * 1.3}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(type.emoji, 0, 0);
                ctx.restore();
            }
        });
        
        ctx.beginPath(); ctx.setLineDash([8, 6]); ctx.strokeStyle = 'rgba(255, 118, 117, 0.6)'; ctx.lineWidth = 3;
        ctx.moveTo(10, DEAD_LINE); ctx.lineTo(WIDTH - 10, DEAD_LINE); ctx.stroke(); ctx.setLineDash([]);

        if (currentFruit && !isClickCooldown && !isPaused && !isGameWon) {
            ctx.beginPath(); ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(45, 52, 54, 0.2)'; ctx.lineWidth = 2;
            ctx.moveTo(currentFruit.position.x, currentFruit.position.y); ctx.lineTo(currentFruit.position.x, HEIGHT - 30);
            ctx.stroke(); ctx.setLineDash([]);
        }
    }

    function spawnReadyFruit() {
        if (isGameOver || isGameWon) return;
        const type = nextFruitType;
        nextFruitType = getRandomFruitType();

        const x = WIDTH / 2; const y = 80;

        currentFruit = Bodies.circle(x, y, type.radius, {
            isStatic: true, isSensor: true, label: 'fruit',
            plugin: { level: type.level },
            render: { fillStyle: type.color }
        });

        Composite.add(engine.world, currentFruit);
        isClickCooldown = false;
    }

    function getRandomFruitType() {
        const randIdx = Math.floor(Math.random() * 4);
        return FRUIT_TYPES[randIdx];
    }

    function moveHandler(clientX) {
        if (!currentFruit || isClickCooldown || isGameOver || isPaused || isGameWon) return;
        const rect = render.canvas.getBoundingClientRect();
        let mouseX = clientX - rect.left;
        const minX = 20 + FRUIT_TYPES[currentFruit.plugin.level].radius;
        const maxX = WIDTH - 20 - FRUIT_TYPES[currentFruit.plugin.level].radius;
        if (mouseX < minX) mouseX = minX; if (mouseX > maxX) mouseX = maxX;
        Body.setPosition(currentFruit, { x: mouseX, y: currentFruit.position.y });
    }

    window.addEventListener('mousemove', (e) => moveHandler(e.clientX));
    window.addEventListener('touchmove', (e) => { if(e.touches.length > 0) moveHandler(e.touches[0].clientX); });

    function dropHandler() {
        if (!currentFruit || isClickCooldown || isGameOver || isPaused || isGameWon) return;
        isClickCooldown = true;
        Body.setStatic(currentFruit, false);
        currentFruit.isSensor = false;
        Body.setVelocity(currentFruit, { x: 0, y: 5 });
        currentFruit = null;
        setTimeout(() => { spawnReadyFruit(); }, 500);
    }
    window.addEventListener('click', dropHandler);
    window.addEventListener('touchend', dropHandler);

    function handleCollision(event) {
        event.pairs.forEach((pair) => {
            const bodyA = pair.bodyA; const bodyB = pair.bodyB;
            if (bodyA.label === 'fruit' && bodyB.label === 'fruit') {
                if (bodyA.plugin.level === bodyB.plugin.level && !bodyA.isDead && !bodyB.isDead) {
                    bodyA.isDead = true; bodyB.isDead = true;
                    const currentLevel = bodyA.plugin.level;
                    
                    // [핵심 변경] 수박(레벨 9) 2개가 충돌했을 때 승리 판정 발동!
                    if (currentLevel === FRUIT_TYPES.length - 1) {
                        Composite.remove(engine.world, [bodyA, bodyB]);
                        updateScore(FRUIT_TYPES[currentLevel].score * 5); // 승리 보너스 대폭 지급
                        triggerGameWon();
                        return;
                    }

                    const newX = (bodyA.position.x + bodyB.position.x) / 2;
                    const newY = (bodyA.position.y + bodyB.position.y) / 2;
                    Composite.remove(engine.world, [bodyA, bodyB]);

                    const nextType = FRUIT_TYPES[currentLevel + 1];
                    const evolvedFruit = Bodies.circle(newX, newY, nextType.radius, {
                        restitution: 0.2, friction: 0.1, label: 'fruit',
                        plugin: { level: nextType.level },
                        render: { fillStyle: nextType.color }
                    });

                    Composite.add(engine.world, evolvedFruit);
                    updateScore(nextType.score);
                    triggerCombo();
                }
            }
        });
    }

    function updateScore(amount) {
        const comboBonus = Math.floor(combo * 1.5);
        score += amount + comboBonus;
        document.getElementById('score').innerText = score;
    }

    function triggerCombo() {
        combo++;
        const comboTag = document.getElementById('combo-tag');
        document.getElementById('combo-count').innerText = combo;
        comboTag.style.opacity = '1';
        clearTimeout(comboTimer);
        comboTimer = setTimeout(() => { combo = 0; comboTag.style.opacity = '0'; }, 2500);
    }

    function checkGameOverLogic() {
        if (isGameOver || isPaused || isGameWon) return; // 승리 상태 시 게임오버 체크 중단
        let isViolating = false;
        const bodies = Composite.allBodies(engine.world);
        for (let body of bodies) {
            if (body.label === 'fruit' && body !== currentFruit && !body.isSensor) {
                if (body.position.y - body.circleRadius < DEAD_LINE) { isViolating = true; break; }
            }
        }
        if (isViolating) {
            if (!gameOverTimestamp) { gameOverTimestamp = Date.now(); } 
            else if (Date.now() - gameOverTimestamp > 3000) { triggerGameOver(); }
        } else { gameOverTimestamp = null; }
    }

    function triggerGameOver() {
        isGameOver = true;
        document.getElementById('final-score').innerText = score;
        document.getElementById('game-over-screen').classList.add('show');
        Runner.stop(runner);
    }

    // [추가] 게임 승리 처리 함수
    function triggerGameWon() {
        isGameWon = true;
        document.getElementById('victory-score').innerText = score;
        document.getElementById('victory-screen').classList.add('show');
        clearTimeout(comboTimer);
        Runner.stop(runner); // 물리 가동 멈춤
    }

    function resetGame() {
        const canvas = container.querySelector('canvas');
        if (canvas) canvas.remove();
        if (engine) { Events.off(engine); Composite.clear(engine.world, false); }
        clearTimeout(comboTimer);
        initGame();
    }

    initGame();
</script>

</body>
</html>
